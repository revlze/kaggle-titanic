base:
  exp_name: gb_best_5_ensebmle
  seed: 1027309
  run_kind: full
run:
  mode: full
  model_path: null
data:
  train_path: data/train.csv
  test_path: data/test.csv
features:
  feature_set: base_title_family_extticket_extcabin
preprocessing:
  encoding: onehot
  scale: false
model:
  name: GradientBoostingClassifier
  params:
    loss: log_loss
    n_estimators: 100
    learning_rate: 0.1
    max_depth: 3
    min_samples_leaf: 1
    subsample: 1.0
    random_state: 1027309
ensemble:
  n_models: 5
  method: hard
  stacking_folds: 3
  meta_model:
    name: LogisticRegression
    params:
      C: 1.0
      max_iter: 2000
validation:
  development_size: 0.8
  n_splits: 5
  inner_splits: 3
tuning:
  enabled: true
  n_trials: 10
  search_space:
    n_estimators:
      type: int
      low: 100
      high: 400
      step: 50
    learning_rate:
      type: float
      low: 0.01
      high: 0.1
      log: true
    max_depth:
      type: int
      low: 2
      high: 4
    min_samples_leaf:
      type: int
      low: 1
      high: 15
metric:
  name: accuracy
output:
  dir: artifacts
