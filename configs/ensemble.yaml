# Copy to config.yaml, then run: uv run python run.py
# Candidate ensemble; its quality has not been evaluated.
base:
  exp_name: mixed_voting_v1
  seed: 0xFACED
  run_kind: full

run:
  mode: full
  model_path: null

data:
  train_path: data/titanic/train.csv
  test_path: data/titanic/test.csv

features:
  feature_set: base_title_family_extticket_extcabin

preprocessing:
  encoding: onehot
  scale: false

model:
  name: ensemble
  params: {}

ensemble:
  method: hard  # soft, hard, stacking
  members:
    # Recorded Gradient Boosting parameters; XGBoost uses the existing baseline.
    - name: GradientBoostingClassifier
      params:
        loss: log_loss
        n_estimators: 350
        learning_rate: 0.07113715398641476
        max_depth: 2
        min_samples_leaf: 8
        subsample: 1.0
      search_space:
        n_estimators: {type: int, low: 100, high: 400, step: 50}
        learning_rate: {type: float, low: 0.01, high: 0.1, log: true}
        max_depth: {type: int, low: 2, high: 4}
        min_samples_leaf: {type: int, low: 1, high: 15}
    - name: XGBClassifier
      params:
        n_estimators: 300
        learning_rate: 0.05
        max_depth: 3
        min_child_weight: 3
        subsample: 0.8
        colsample_bytree: 0.8
        reg_lambda: 1.0
        objective: binary:logistic
        eval_metric: logloss
        tree_method: hist
        n_jobs: 1
      search_space:
        n_estimators: {type: int, low: 150, high: 500, step: 50}
        learning_rate: {type: float, low: 0.02, high: 0.1, log: true}
        max_depth: {type: int, low: 2, high: 5}
        min_child_weight: {type: int, low: 1, high: 8}
    # Recorded LightGBM parameters for the same feature set.
    - name: LGBMClassifier
      params:
        n_estimators: 200
        learning_rate: 0.05087613600602459
        num_leaves: 7
        max_depth: 4
        min_child_samples: 32
        subsample: 0.9802061140926253
        subsample_freq: 1
        colsample_bytree: 0.7580994560295949
        reg_lambda: 1.0
        verbosity: -1
        n_jobs: 1
      search_space:
        n_estimators: {type: int, low: 100, high: 500, step: 50}
        learning_rate: {type: float, low: 0.02, high: 0.1, log: true}
        num_leaves: {type: int, low: 7, high: 15}
        min_child_samples: {type: int, low: 10, high: 40}
  stacking_folds: 3
  meta_model:
    name: LogisticRegression
    params: {C: 1.0, max_iter: 2000}

validation:
  train_size: 0.8
  n_splits: 5
  inner_splits: 3

tuning:
  enabled: false  # Uses fixed member parameters without Optuna.
  n_trials: 10  # Per outer fold, plus one separate final search when enabled.
  search_space: {}  # Ensemble search ranges are defined per member above.

metric:
  name: accuracy

output:
  dir: artifacts
