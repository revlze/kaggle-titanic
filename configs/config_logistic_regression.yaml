# Copy to config.yaml, then run: uv run python run.py
base:
  exp_name: logistic_regression_baseline
  seed: 0xFACED
  run_kind: full

run:
  mode: full
  model_path: null

data:
  train_path: data/titanic/train.csv
  test_path: data/titanic/test.csv

features:
  feature_set: base_title_family

preprocessing:
  encoding: onehot
  scale: true

model:
  name: LogisticRegression
  params:
    C: 1.0
    max_iter: 2000
    random_state: ${base.seed}

ensemble:
  n_models: 1  # Identical deterministic fits gain nothing from extra seeds.
  method: soft
  stacking_folds: 3
  meta_model:
    name: LogisticRegression
    params: {C: 1.0, max_iter: 2000}

validation:
  development_size: 0.8
  n_splits: 5
  inner_splits: 3

tuning:
  enabled: false  # Set true to use Optuna; use a new exp_name for the tuned run.
  n_trials: 20  # Per outer fold, plus one separate final search.
  search_space:
    C: {type: float, low: 0.001, high: 100.0, log: true}

metric:
  name: accuracy

output:
  dir: artifacts
