# Copy to config.yaml, then run: uv run python run.py
base:
  exp_name: gb_lr_rf_dt_optuna_v1
  seed: 0xFACED
  run_kind: full

run:
  mode: full
  model_path: null

data:
  train_path: data/train.csv
  test_path: data/test.csv

features:
  feature_set: base_title_family_extticket_extcabin

preprocessing:
  encoding: onehot
  scale: false

model:
  name: ensemble
  params: {}

ensemble:
  method: soft  # Average class probabilities from all four models.
  members:
    # Each member has its own Optuna ranges.
    - name: GradientBoostingClassifier
      params:
        loss: log_loss
        n_estimators: 350
        learning_rate: 0.07113715398641476
        max_depth: 2
        min_samples_leaf: 8
        subsample: 1.0
      search_space:
        n_estimators: {type: int, low: 100, high: 400, step: 50}
        learning_rate: {type: float, low: 0.01, high: 0.1, log: true}
        max_depth: {type: int, low: 2, high: 4}
        min_samples_leaf: {type: int, low: 1, high: 15}
        subsample: {type: float, low: 0.7, high: 1.0}
    - name: LogisticRegression
      preprocessing:
        scale: true
      params:
        C: 1.0
        max_iter: 2000
      search_space:
        C: {type: float, low: 0.001, high: 100.0, log: true}
    - name: RandomForestClassifier
      params:
        n_estimators: 300
        max_depth: 8
        min_samples_leaf: 2
        max_features: sqrt
        n_jobs: 1
      search_space:
        n_estimators: {type: int, low: 100, high: 400, step: 100}
        max_depth: {type: int, low: 3, high: 12}
        min_samples_leaf: {type: int, low: 1, high: 8}
        max_features: {type: categorical, choices: [sqrt, log2, 0.8]}
    - name: DecisionTreeClassifier
      params:
        max_depth: 5
        min_samples_leaf: 4
        criterion: gini
      search_space:
        max_depth: {type: int, low: 2, high: 10}
        min_samples_leaf: {type: int, low: 1, high: 15}
        criterion: {type: categorical, choices: [gini, entropy]}
  stacking_folds: 3
  meta_model:
    name: LogisticRegression
    params: {C: 1.0, max_iter: 2000}

validation:
  train_size: 0.8
  n_splits: 5
  inner_splits: 3

tuning:
  enabled: true
  n_trials: 10  # Per outer fold, plus one separate final search.
  n_jobs: 4  # Concurrent Optuna trials; 1 = sequential, -1 = all CPUs.
  search_space: {}  # Ensemble search ranges are defined per member above.

metric:
  name: accuracy

output:
  dir: artifacts
