# Copy to config.yaml, then run: uv run python run.py
base:
  exp_name: gradient_boosting_baseline
  seed: 0xFACED
  run_kind: full

run:
  mode: full
  model_path: null

data:
  train_path: data/titanic/train.csv
  test_path: data/titanic/test.csv

features:
  feature_set: base_title_family

preprocessing:
  encoding: onehot
  scale: false

model:
  name: GradientBoostingClassifier
  params:
    loss: log_loss
    n_estimators: 100
    learning_rate: 0.1
    max_depth: 3
    min_samples_leaf: 1
    subsample: 1.0  # Values below 1 add row subsampling.
    random_state: ${base.seed}

ensemble:
  n_models: 1  # Set to 5 for five seeds; subsample < 1 adds diversity.
  method: soft  # soft, hard, stacking
  stacking_folds: 3
  meta_model:
    name: LogisticRegression
    params: {C: 1.0, max_iter: 2000}

validation:
  development_size: 0.8
  n_splits: 5
  inner_splits: 3

tuning:
  enabled: false  # Set true to use Optuna; use a new exp_name for the tuned run.
  n_trials: 20  # Per outer fold, plus one separate final search.
  search_space:
    n_estimators: {type: int, low: 100, high: 400, step: 50}
    learning_rate: {type: float, low: 0.01, high: 0.1, log: true}
    max_depth: {type: int, low: 2, high: 4}
    min_samples_leaf: {type: int, low: 1, high: 15}

metric:
  name: accuracy

output:
  dir: artifacts
