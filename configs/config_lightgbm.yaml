# Copy to config.yaml, then run: uv run python run.py
base:
  exp_name: lightgbm_baseline
  seed: 0xFACED
  run_kind: full

run:
  mode: full
  model_path: null

data:
  train_path: data/titanic/train.csv
  test_path: data/titanic/test.csv

features:
  feature_set: base_title_family

preprocessing:
  encoding: onehot
  scale: false

model:
  name: LGBMClassifier
  params:
    n_estimators: 300
    learning_rate: 0.05
    num_leaves: 15
    max_depth: 4
    min_child_samples: 20
    subsample: 0.8
    subsample_freq: 1  # Activates row subsampling.
    colsample_bytree: 0.8
    reg_lambda: 1.0
    verbosity: -1
    n_jobs: 1
    random_state: ${base.seed}

ensemble:
  n_models: 1  # Set to 5 for five models with different seeds.
  method: soft  # soft, hard, stacking
  stacking_folds: 3
  meta_model:
    name: LogisticRegression
    params: {C: 1.0, max_iter: 2000}

validation:
  development_size: 0.8
  n_splits: 5
  inner_splits: 3

tuning:
  enabled: false  # Set true to use Optuna; use a new exp_name for the tuned run.
  n_trials: 20  # Per outer fold, plus one separate final search.
  search_space:
    n_estimators: {type: int, low: 100, high: 500, step: 50}
    learning_rate: {type: float, low: 0.02, high: 0.1, log: true}
    num_leaves: {type: int, low: 7, high: 15}  # Keep consistent with max_depth: 4.
    min_child_samples: {type: int, low: 10, high: 40}
    subsample: {type: float, low: 0.7, high: 1.0}
    colsample_bytree: {type: float, low: 0.7, high: 1.0}

metric:
  name: accuracy

output:
  dir: artifacts
