# Copy to config.yaml, then run: uv run python run.py
base:
  exp_name: random_forest_baseline
  seed: 0xFACED
  run_kind: full

run:
  mode: full
  model_path: null

data:
  train_path: data/train.csv
  test_path: data/test.csv

features:
  feature_set: base_title_family_extticket_extcabin

preprocessing:
  encoding: onehot
  scale: false

model:
  name: RandomForestClassifier
  params:
    n_estimators: 300
    max_depth: 6
    min_samples_leaf: 3
    max_features: sqrt
    n_jobs: 1
    random_state: ${base.seed}

ensemble:
  n_models: 1
  method: soft
  stacking_folds: 3
  meta_model:
    name: LogisticRegression
    params: {C: 1.0, max_iter: 2000}

validation:
  train_size: 0.8
  n_splits: 5
  inner_splits: 3

tuning:
  enabled: false  # Set true to use Optuna; use a new exp_name for the tuned run.
  n_trials: 20  # Per outer fold, plus one separate final search.
  search_space:
    n_estimators: {type: int, low: 100, high: 400, step: 100}
    max_depth: {type: int, low: 3, high: 12}
    min_samples_leaf: {type: int, low: 1, high: 8}
    max_features: {type: categorical, choices: [sqrt, log2, 0.8]}

metric:
  name: accuracy

output:
  dir: artifacts
