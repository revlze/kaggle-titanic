[project]
name = "final-proj"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Platon U.", email = "revlze@yahoo.com" }
]
requires-python = ">=3.14"
dependencies = [
    "catboost>=1.2.10",
    "kaggle>=2.2.5",
    "lightgbm>=4.7.0",
    "marimo>=0.25.2",
    "numpy>=2.5.3",
    "omegaconf>=2.4.0",
    "optuna>=5.0.0",
    "optuna-integration[sklearn]>=5.0.0",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "skorch>=1.4.0",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "tqdm>=4.70.1",
    "xgboost>=3.4.1",
]

[tool.uv]
package = true 

[tool.marimo.runtime]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["data", "features", "models", "training", "utils", "evaluation"]
